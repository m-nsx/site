<body>

    <nav class="links" aria-label="Liens principaux">

    <p class="sub"></p>

  <script>
    // Usage (console): addLink({href:'https://...', label:'Mon lien', icon:'⭐', variant:'muted'})
    window.addLink = function(o){
      if(!o||!o.href) return;
      const nav = document.querySelector('.links');
      const a = document.createElement('a'); a.className='link-btn'; a.href=o.href; a.target='_blank'; a.rel='noopener noreferrer';
      if(o.variant) a.setAttribute('data-variant', o.variant);
      a.innerHTML = `<span class=\"icon\" aria-hidden=\"true\">${o.icon||'🔗'}</span>`+
                    `<span class=\"label\">${o.label||o.href}</span>`+
                    `<span class=\"arrow\">→</span>`;
      nav.appendChild(a);
      return a;
    }
  </script>
  <!-- Particles: canvas + inline script -->
  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <div id="rainbow-overlay" aria-hidden="true"></div>
  <script>
    (function(){
      // Minimal performant particle system + rainbow overlay triggered by keywords
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      const rainbowOverlay = document.getElementById('rainbow-overlay');
      let DPR = Math.max(1, window.devicePixelRatio || 1);
      let width = 0, height = 0;

      function resize(){
        DPR = Math.max(1, window.devicePixelRatio || 1);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        canvas.width = Math.floor(width * DPR);
        canvas.height = Math.floor(height * DPR);
        ctx.setTransform(1,0,0,1,0,0);
        ctx.scale(DPR, DPR);
      }

      // particle pool for re-use
      const MAX = 250;
      const particles = [];
      for(let i=0;i<MAX;i++) particles.push({alive:false});

      function spawn(x,y){
        // only spawn when particlesEnabled
        if(!particlesEnabled) return;
        for(let i=0;i<MAX;i++){
          const p = particles[i];
          if(!p.alive){
            p.alive = true;
            p.x = x;
            p.y = y;
            const speed = 0.5 + Math.random()*2.5;
            const angle = (Math.random()*Math.PI*2);
            p.vx = Math.cos(angle)*speed;
            p.vy = Math.sin(angle)*speed - (Math.random()*1);
            p.life = 600 + Math.random()*600; // ms
            p.size = 1 + Math.random()*3.5;
            p.birth = performance.now();
            p.hue = 190 + Math.random()*60; // bluish hues
            return;
          }
        }
      }

      // activation via keyboard keywords
      let particlesEnabled = false;
      let rainbowEnabled = false;
      let vineEnabled = false;
      const KEY_PART = 'particles';
      const KEY_RAIN = 'rainbow';
      const KEY_VINE = 'vine';
      let keyBuf = '';
      const MAXKEY = Math.max(KEY_PART.length, KEY_RAIN.length, KEY_VINE.length);

      // Preload vine audio base (will be cloned for overlapping playback)
      let vineAudioBase = null;
      try {
        vineAudioBase = new Audio('media/vine.mp3');
        vineAudioBase.preload = 'auto';
        vineAudioBase.volume = 0.9;
      } catch(e){ vineAudioBase = null; }

      let lastVinePlay = 0; // ms timestamp for throttling vine plays

      window.addEventListener('keydown', (ev) => {
        const k = ev.key;
        if(k === 'Escape'){
          // disable all
          particlesEnabled = false;
          rainbowEnabled = false;
          vineEnabled = false;
          document.body.classList.remove('rainbow-active');
          return;
        }
        // accept letters and accented letters
        if(k.length === 1 && /[a-zA-Zàâçéèêëîïôûùüÿñæœ]/i.test(k)){
          keyBuf += k.toLowerCase();
          if(keyBuf.length > MAXKEY) keyBuf = keyBuf.slice(-MAXKEY);

          if(!particlesEnabled && keyBuf.endsWith(KEY_PART)){
            particlesEnabled = true;
            console.info('Particules activées');
            const cx = window.innerWidth/2, cy = window.innerHeight/2;
            for(let i=0;i<30;i++) spawn(cx + (Math.random()-0.5)*80, cy + (Math.random()-0.5)*80);
          }

          if(keyBuf.endsWith(KEY_RAIN)){
            rainbowEnabled = !rainbowEnabled;
            document.body.classList.toggle('rainbow-active', rainbowEnabled);
            console.info('Rainbow mode', rainbowEnabled ? 'ON' : 'OFF');
          }

          if(!vineEnabled && keyBuf.endsWith(KEY_VINE)){
            vineEnabled = true;
            console.info('Vine sound activé');
            // attempt to unlock audio by playing a silent clone (some browsers require user gesture)
            if(vineAudioBase){
              const unlock = vineAudioBase.cloneNode();
              unlock.volume = 0;
              unlock.play().catch(()=>{});
            }
          }

        } else if(k === 'Backspace'){
          keyBuf = keyBuf.slice(0, -1);
        }
      }, {passive:true});

      let lastMove = 0;
      let active = true;

      function onMove(e){
        if(!particlesEnabled && !vineEnabled) return; // ignore until keyword typed
        const now = performance.now();
        lastMove = now;
        const touches = e.touches ? e.touches : [e];
        for(const t of touches){
          const rect = canvas.getBoundingClientRect();
          const x = (t.clientX - rect.left);
          const y = (t.clientY - rect.top);
          // spawn a few particles per event for density
          for(let i=0;i<3;i++) spawn(x + (Math.random()-0.5)*8, y + (Math.random()-0.5)*8);
        }
        // play vine sound (throttled) when enabled
        if(vineEnabled && vineAudioBase){
          const nowms = performance.now();
          if(nowms - lastVinePlay > 180){ // throttle to ~5-6 plays/sec
            lastVinePlay = nowms;
            const a = vineAudioBase.cloneNode();
            a.volume = 0.9;
            a.play().catch(()=>{});
          }
        }
      }

      // pointer & touch
      window.addEventListener('mousemove', onMove, {passive:true});
      window.addEventListener('touchmove', onMove, {passive:true});

      // animation loop
      let last = performance.now();
      function tick(now){
        const dt = now - last;
        last = now;

        ctx.clearRect(0,0,width,height);

        for(let i=0;i<MAX;i++){
          const p = particles[i];
          if(!p.alive) continue;
          const age = now - p.birth;
          const t = age / p.life;
          if(t >= 1){ p.alive = false; continue; }
          // simple physics
          p.vy += 0.0025 * dt; // gravity-ish
          p.x += p.vx * (dt/16);
          p.y += p.vy * (dt/16);

          const alpha = 1 - Math.pow(t, 1.2);
          const size = p.size * (1 - t);

          ctx.beginPath();
          ctx.fillStyle = `hsla(${p.hue},80%,60%,${alpha})`;
          ctx.arc(p.x, p.y, size, 0, Math.PI*2);
          ctx.fill();
        }

        // sleep the loop when inactive to save CPU
        if(performance.now() - lastMove > 2500 && active){
          active = false;
          setTimeout(()=>{ requestAnimationFrame(tick); last = performance.now(); }, 1000);
          return;
        }

        requestAnimationFrame(tick);
      }

      // start
      resize();
      window.addEventListener('resize', resize, {passive:true});
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
